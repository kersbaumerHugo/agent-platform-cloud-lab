name: Floci EC2 local release contract tests

on:
  push:
    branches: [main]
    paths:
      - 'apps/floci-http/**'
      - 'scripts/check-floci-ec2-health.sh'
      - 'scripts/deploy-floci-ec2-app.sh'
      - 'scripts/check-floci-ec2-functional.sh'
      - 'tests/test-floci-readiness.sh'
      - 'tests/test-floci-release.sh'
      - 'tests/test-floci-functional.sh'
      - '.github/workflows/floci-readiness-ci.yml'
  pull_request:
    paths:
      - 'apps/floci-http/**'
      - 'scripts/check-floci-ec2-health.sh'
      - 'scripts/deploy-floci-ec2-app.sh'
      - 'scripts/check-floci-ec2-functional.sh'
      - 'tests/test-floci-readiness.sh'
      - 'tests/test-floci-release.sh'
      - 'tests/test-floci-functional.sh'
      - '.github/workflows/floci-readiness-ci.yml'

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate scripts
        run: |
          bash -n scripts/deploy-floci-ec2-app.sh
          bash -n scripts/check-floci-ec2-functional.sh
          sh -n apps/floci-http/activate.sh
          for handler in apps/floci-http/releases/*/handler.sh; do sh -n "$handler"; done
      - name: Readiness contract (no Floci needed)
        run: bash tests/test-floci-readiness.sh
      - name: Release and rollback contract (no Floci needed)
        run: bash tests/test-floci-release.sh
      - name: Functional HTTP release contracts (no Floci needed)
        run: bash tests/test-floci-functional.sh
