services:
  floci-az:
    image: floci/floci-az:0.13.0
    container_name: agent-platform-floci-az

    ports:
      - "4577:4577"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data

    environment:
      FLOCI_AZ_TLS_ENABLED: "true"
      FLOCI_AZ_HOSTNAME: localhost

    restart: unless-stopped
