services:
  floci:
    image: floci/floci:2.1.0
    container_name: agent-platform-floci-aws

    ports:
      - "4566:4566"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data

    environment:
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data

    restart: unless-stopped
